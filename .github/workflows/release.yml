name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Validate release version
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const manifest = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const versions = JSON.parse(fs.readFileSync("versions.json", "utf8"));
          const tag = process.env.GITHUB_REF_NAME;

          if (tag !== manifest.version) throw new Error("tag must match manifest version");
          if (pkg.version !== manifest.version) throw new Error("package.json version must match manifest.json");
          if (versions[manifest.version] !== manifest.minAppVersion) throw new Error("versions.json must match manifest version/minAppVersion");
          NODE

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Create install archive
        run: |
          mkdir -p dist/sparkore-kb-reader
          cp main.js manifest.json dist/sparkore-kb-reader/
          cd dist
          zip -r sparkore-kb-reader.zip sparkore-kb-reader

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          main.js
          manifest.json
          dist/sparkore-kb-reader.zip
          --title "Sparkore KB Reader ${GITHUB_REF_NAME}"
          --generate-notes
